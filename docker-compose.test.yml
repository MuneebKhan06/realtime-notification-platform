services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notifications_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notifications_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://notify:notify@postgres-test:5432/notifications_test
    depends_on:
      postgres-test:
        condition: service_healthy

  gateway-test-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    environment:
      INSTANCE_ID: instance-1
      DATABASE_URL: postgresql+asyncpg://notify:notify@postgres-test:5432/notifications_test
      REDIS_URL: redis://redis-test:6379/0
      JWT_SECRET_KEY: integration-test-secret
    ports:
      - "8001:8000"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway-test-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    environment:
      INSTANCE_ID: instance-2
      DATABASE_URL: postgresql+asyncpg://notify:notify@postgres-test:5432/notifications_test
      REDIS_URL: redis://redis-test:6379/0
      JWT_SECRET_KEY: integration-test-secret
    ports:
      - "8002:8000"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
