events {
    worker_connections 4096;
}

http {
    # Plain round-robin, no sticky sessions by design: cross-instance
    # delivery is handled by the Redis instance registry (see Decision 3
    # in the project README), so any instance can serve any client.
    upstream gateway_pool {
        server gateway-1:8000;
        server gateway-2:8000;
        server gateway-3:8000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gateway_pool;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
