services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notifications
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://notify:notify@postgres:5432/notifications
    depends_on:
      postgres:
        condition: service_healthy

  gateway-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    env_file: .env
    environment:
      INSTANCE_ID: instance-1
      DATABASE_URL: postgresql+asyncpg://notify:notify@postgres:5432/notifications
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  gateway-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    env_file: .env
    environment:
      INSTANCE_ID: instance-2
      DATABASE_URL: postgresql+asyncpg://notify:notify@postgres:5432/notifications
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  gateway-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    env_file: .env
    environment:
      INSTANCE_ID: instance-3
      DATABASE_URL: postgresql+asyncpg://notify:notify@postgres:5432/notifications
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3

volumes:
  postgres_data:
