[project]
name = "realtime-notification-platform"
version = "0.1.0"
description = "Real-time notification and presence platform built on WebSockets, Redis Pub/Sub and PostgreSQL"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests", "scripts", "load_tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a running Redis and PostgreSQL instance",
]
