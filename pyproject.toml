[project]
name = "realtime-notification-platform"
version = "0.2.0"
description = "Real-time notification and presence platform built on WebSockets, Redis Pub/Sub and PostgreSQL"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests", "scripts", "load_tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a running Redis and PostgreSQL instance",
]

[tool.mypy]
python_version = "3.10"
files = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["fakeredis.*", "locust.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
fail_under = 80
